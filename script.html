<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Spanish Trainer</title>
    <link rel="stylesheet" href="StyleSheet2.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
    <!--контейнер выбора времени-->
    <div class="div1">
        <!--кнопка-->
        <button id="SelectTenses" class="bst">⚙️ Select tenses ▼</button>
        <!--контейнер списка времен-->
        <div id="dropTenses" class="dt">
            <p>Tenses to study:</p>
            <ul class="task-list">
                <li>
                    <input type="checkbox" id="Presente" />
                    <label for="Presente">Presente</label>
                </li>
                <li>
                    <input type="checkbox" id="PreteritoIndefinido" />
                    <label for="PreteritoIndefinido">Preterito Indefinido</label>
                </li>
                <li>
                    <input type="checkbox" id="PreteritoImperfecto" />
                    <label for="PreteritoImperfecto">Preterito Imperfecto</label>
                </li>
                <li>
                    <input type="checkbox" id="FuturoSimple" />
                    <label for="FuturoSimple">Futuro Simple</label>
                </li>
                <li>
                    <input type="checkbox" id="CondicionalSimple" />
                    <label for="CondicionalSimple">Condicional Simple</label>
                </li>
            </ul>
        </div>
    </div>

    <!--контейнер справочника-->

    <button id="Tenseguide" class="bst2">📖 Tense guide</button>
    <div id="modal-popup" class="modal-popup"> <!--Затемнение-->
        <div class="modal-content"> <!--Вместе с кнопкой-->
            <span id="close-modal" class="close-btn">&times;</span>
            <h3>Conjugation guide</h3>
            <div id="modal-tense-container"></div>
        </div>
    </div>

    <!--Глагол-->
            <h1>Hablar</h1>

            <!--Карта-->
            <div class="card">
                <!--Сверху-->
                <div class="card-top">
                    <p id="textNoun">Yo</p>
                    <span id="card-tense-tag" class="tenseTag">Presente</span>
                </div>
                <!--Снизу-->
                <div class="card-bottom">

                    <input type="text" id="user-input" class="user-input" placeholder="Type your answer..." />
                    <div class="wrapeper">
                        <button class="signs" id="dsigns">
                            á<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15"
                                  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                  stroke-linejoin="round" class="lucide lucide-chevron-right preview-icon">
                            <path d="m9 18 6-6-6-6" /></svg>
                        </button>
                        <div id="accent-menu" class="menu">
                            <button class="letter-btn">á</button>
                            <button class="letter-btn">é</button>
                            <button class="letter-btn">í</button>
                            <button class="letter-btn">ó</button>
                            <button class="letter-btn">ú</button>
                        </div>
                    </div>
                    <button id="random-btn">Check</button>
                    <div class="result-message-container">
                        <p id="result-message"></p>
                    </div>
                </div>
            </div>
            <!--контейнер правильности карточек-->
            <div class="score-card">
                <span class="correct">Correct: <span id="correct-count">0</span></span>
                <span class="divider">|</span>
                <span class="incorrect">Incorect: <span id="incorrect-count">0</span></span>
            </div>
            <script src="Script2.js"></script>
</body>
</html>
